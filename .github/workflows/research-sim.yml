name: Research simulation

on:
  push:
    branches:
      - chatgpt-connectivity-test
    paths:
      - "research/run.properties"
      - "research/decks/**"
      - ".github/workflows/research-sim.yml"
      - "forge-core/src/main/java/forge/util/ResearchMode.java"
      - "forge-game/src/main/java/forge/game/GameLog.java"
      - "forge-game/src/main/java/forge/game/GameLogFormatter.java"
      - "forge-game/src/main/java/forge/game/ResearchGameLogJson.java"
      - "forge-game/src/main/java/forge/game/ResearchHandTracker.java"
      - "forge-game/src/main/java/forge/game/player/Player.java"
      - "forge-game/src/main/java/forge/game/ResearchDecisionRecord.java"
      - "forge-ai/src/main/java/forge/ai/AiController.java"
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Read simulation configuration
        shell: bash
        run: |
          set -a
          source research/run.properties
          set +a

          RESEARCH_MODE="${RESEARCH_MODE:-false}"

          {
            echo "RESEARCH_MODE=$RESEARCH_MODE"
            echo "DECK_DIR=$DECK_DIR"
            echo "DECK1=$DECK1"
            echo "DECK2=$DECK2"
            echo "GAMES=$GAMES"
            echo "MATCH_SIZE=$MATCH_SIZE"
            echo "SEED=$SEED"
            echo "TIMEOUT=$TIMEOUT"
            echo "QUIET=$QUIET"
          } >> "$GITHUB_ENV"

      - name: Build Forge desktop and dependencies
        run: mvn -U -B -pl forge-gui-desktop -am package -DskipTests

      - name: Locate runnable desktop jar
        id: jar
        shell: bash
        run: |
          JAR="$(find forge-gui-desktop/target -maxdepth 1 -type f -name '*-jar-with-dependencies.jar' | head -n 1)"
          if [ -z "$JAR" ]; then
            echo "Runnable desktop jar was not produced."
            find forge-gui-desktop/target -maxdepth 1 -type f -print || true
            exit 1
          fi
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Using $JAR"

      - name: Run Forge simulation
        shell: bash
        run: |
          set -o pipefail

          if [ ! -d "$GITHUB_WORKSPACE/$DECK_DIR" ]; then
            echo "Deck directory not found: $GITHUB_WORKSPACE/$DECK_DIR"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/$DECK_DIR/$DECK1" ]; then
            echo "Deck 1 not found: $GITHUB_WORKSPACE/$DECK_DIR/$DECK1"
            exit 1
          fi
          if [ ! -f "$GITHUB_WORKSPACE/$DECK_DIR/$DECK2" ]; then
            echo "Deck 2 not found: $GITHUB_WORKSPACE/$DECK_DIR/$DECK2"
            exit 1
          fi

          BASE_ARGS=(
            sim
            -D "$GITHUB_WORKSPACE/$DECK_DIR"
            -d "$DECK1" "$DECK2"
            -c "$TIMEOUT"
          )

          if [ "$QUIET" = "true" ]; then
            BASE_ARGS+=( -q )
          fi

          echo "Research mode: $RESEARCH_MODE"
          echo "Match size: $MATCH_SIZE"
          echo "Match count: $MATCH_COUNT"

          : > "$GITHUB_WORKSPACE/research-sim.log"
          : > "$GITHUB_WORKSPACE/research-playlog.jsonl"

          cd forge-gui

          if [ "$MATCH_SIZE" -gt 0 ]; then
            for i in $(seq 1 "$MATCH_COUNT"); do
              RUN_SEED=$((SEED + i - 1))
              RUN_JSON="$GITHUB_WORKSPACE/research-playlog-$i.jsonl"
              echo "===== MATCH $i / $MATCH_COUNT | seed=$RUN_SEED =====" | tee -a "$GITHUB_WORKSPACE/research-sim.log"
              java \
                -Djava.awt.headless=true \
                -Dforge.research="$RESEARCH_MODE" \
                -Dforge.research.jsonLog="$RUN_JSON" \
                -jar "../${{ steps.jar.outputs.jar }}" \
                "${BASE_ARGS[@]}" -s "$RUN_SEED" -m "$MATCH_SIZE" \
                2>&1 | tee -a "$GITHUB_WORKSPACE/research-sim.log"
              if [ -f "$RUN_JSON" ]; then
                cat "$RUN_JSON" >> "$GITHUB_WORKSPACE/research-playlog.jsonl"
              fi
            done
          else
            java \
              -Djava.awt.headless=true \
              -Dforge.research="$RESEARCH_MODE" \
              -Dforge.research.jsonLog="$GITHUB_WORKSPACE/research-playlog.jsonl" \
              -jar "../${{ steps.jar.outputs.jar }}" \
              "${BASE_ARGS[@]}" -s "$SEED" -n "$GAMES" \
              2>&1 | tee -a "$GITHUB_WORKSPACE/research-sim.log"
          fi

      - name: Show result summary
        if: always()
        shell: bash
        run: |
          echo "===== Forge research simulation summary ====="
          grep -E "Simulation mode|Ai\(|Game Outcome: Turn|Game Outcome: .*has (won|lost)|Match Result:|Game Result:" research-sim.log || true
          if [ -f research-playlog.jsonl ]; then
            echo "Research JSON log lines: $(wc -l < research-playlog.jsonl)"
            echo "===== First 5 research JSON events ====="
            head -n 5 research-playlog.jsonl
          fi

      - name: Upload simulation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-simulation-log
          path: |
            research-sim.log
            research-playlog.jsonl
            research/run.properties
          if-no-files-found: warn
